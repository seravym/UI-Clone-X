<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks - X Clone</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="bookmark.css">
    <link rel="stylesheet" href="../mobile.css">
</head>

<body data-bottom-nav>
    <aside class="sidebar-left">
        <div id="sidebar"></div>
    </aside>

    <main class="bookmarks">

        <header class="bookmarks-header">
            <button class="mobile-menu-button" aria-label="Open navigation" aria-haspopup="dialog">
                <img src="../login/logo.jpg" alt="">
            </button>
            <h1>Bookmarks</h1>
        </header>

        <div class="bookmark-search">
            <span class="search-icon">🔍</span>
            <input type="text" id="bookmark-search" placeholder="Search Bookmarks">
        </div>

        <section class="bookmark-empty">
            <h2>Save posts for later</h2>
            <p>Bookmark posts to easily find them again in the future.</p>
        </section>

        <div id="bookmark-list"></div>
    </main>

    <aside class="bookmark-trending">
        <div class="bookmark-trending-box">
            <h2 class="bookmark-trending-title">Trending untuk Anda</h2>
            <div id="bookmarkTrending"></div>
        </div>
    </aside>

    <script src="bookmark.js"></script>
    <script src="../mobile-navigation.js"></script>
    <script src="/user-loader.js"></script>
</body>
</html>
