<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - X Clone</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="explore.css">
    <link rel="stylesheet" href="explore-detail.css">
    <link rel="stylesheet" href="../mobile.css">

</head>

<body>
    <aside class="sidebar-left">
        <div id="sidebar"></div>
    </aside>

    <main class="explore">
        <header class="explore-header">
            <a href="../home/home.html" class="back-button" aria-label="Kembali ke Home">&larr;</a>
            <div class="search-wrap" id="search-wrap">
                <label class="search-box">
                    <span class="search-icon" aria-hidden="true">&#128269;</span>
                    <input type="search" id="search" placeholder="Cari topik, akun, atau postingan" autocomplete="off" aria-label="Cari di Explore">
                </label>
                <div class="search-dropdown" id="search-dropdown" hidden></div>
            </div>
        </header>

        <nav class="explore-nav" id="tabs" aria-label="Kategori Explore"></nav>

        <div id="results"></div>
    </main>

    <aside class="side" aria-label="Sidebar">
        <section class="widget" id="side-news"></section>
        <section class="widget" id="side-follow"></section>

        <footer class="side-footer">
            <a href="#">Ketentuan</a>
            <a href="#">Privasi</a>
            <a href="#">Cookie</a>
            <a href="#">Aksesibilitas</a>
            <span>&copy; 2026 X Clone</span>
        </footer>
    </aside>

    <nav class="mobile-bottom-nav" aria-label="Navigasi bawah">
        <a class="mobile-bottom-link" href="../home/home.html" aria-label="Home">
            <img src="../image/icons/home.svg" alt="">
        </a>
        <a class="mobile-bottom-link" href="../explore/explore.html" aria-label="Search">
            <img src="../image/icons/search.svg" alt="">
        </a>
        <a class="mobile-bottom-link active" href="notifications.html" aria-label="Notifications" aria-current="page">
            <img src="../image/icons/notifications.svg" alt="">
        </a>
        <a class="mobile-bottom-link" href="../chat/chat.html" aria-label="Messages">
            <img src="../image/icons/chat.svg" alt="">
        </a>
        <button class="mobile-bottom-link mobile-bottom-menu" aria-label="Open sidebar">
            <img src="../image/icons/profile.svg" alt="">
        </button>
    </nav>

    <script src="explore.js"></script>
    <script src="../mobile-navigation.js"></script>
    <script src="/user-loader.js"></script>

</body>
</html>
