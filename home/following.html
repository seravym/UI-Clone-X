<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Following / X Clone — Kelompok 9</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="../css/style.css">

</head>
<body>
    <div class="layout-container">
        
        <aside class="sidebar-left">
            <div id="sidebar">
            </div>
        </aside>

        <main class="feed">
            <header class="feed-header">
                <h1>Home</h1>
                <div class="feed-tabs">
                    <a href="home.html"><br>For You</br></a>
                    <a href="following.html" class="border-pink"><br>Following</br></a>
                </div>
            </header>

            <div class="create-post">
                <img src="../image/Default_pfp.jpeg" alt="Pfp" class="pfp">
                <div style="width: 100%;">
                    <textarea placeholder="What is happening?!" class="post-input"></textarea>
                    <div style="text-align: right; margin-top: 10px;">
                        <button class="bg-pink btn-reply">Post</button>
                    </div>
                </div>
            </div>

            <div class="post-container" onclick="window.location.href='post.html'">
                <img src="../image/Default_pfp.jpeg" alt="Pfp" class="pfp">
                <div style="width: 100%;">
                    <b>BestieKyuuu</b> <span style="color: gray;">@bestie · 5m</span>
                    <p>Hanya melihat post dari orang yang kamu ikuti di tab ini. 💕</p>
                </div>
            </div>
        </main>

        <aside class="right-sidebar">
            <input type="text" placeholder="Search..." class="search-bar">
        </aside>

    </div>
    <script src="home.js"></script>
</body>
</html>
