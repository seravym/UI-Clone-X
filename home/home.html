<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home / X Clone — Kelompok 9</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../mobile.css">
    
</head>

<body>
    <div class="layout-container">
        
        <aside class="sidebar-left">
            <div id="sidebar">
            </div>
        </aside>

        <main class="feed">
            <header class="feed-header">
                <h1>Home</h1>
                <div class="feed-tabs">
                    <a href="javascript:void(0);" class="tab-btn border-pink" data-tab="foryou"><br>For You</br></a>
                    <a href="javascript:void(0);" class="tab-btn" data-tab="following"><br>Following</br></a>
                </div>
            </header>

            <div class="create-post">
                <img src="../image/Default_pfp.jpeg" alt="Pfp" class="pfp">
                <div style="width: 100%;">
                    <textarea placeholder="What is happening?!" class="post-input"></textarea>
                    <div style="text-align: right; margin-top: 10px;">
                        <button class="bg-pink btn-reply">Post</button>
                    </div>
                </div>
            </div>

            <div id="feed-container"></div>
        </main>

        <aside class="right-sidebar">
            <input type="text" placeholder="Search..." class="search-bar">
            <div class="trending-box">
                <h4>Trending</h4>
                <p class="text-pink">#randomtrend</p>
            </div>
        </aside>

    </div>
    <script src="home.js"></script>
    <script src="data.js"></script>
    <script src="../mobile-navigation.js"></script>
    <script src="../user-loader.js"></script>
</body>
</html>
