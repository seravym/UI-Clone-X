<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications / X</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .notif-filter-icon svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>

<body>
    <div class="notifications">
        <div class="notif-layout">

            <!-- Sidebar -->
            <aside class="sidebar-left">
                <div id="sidebar">
                    <!-- Diisi oleh JavaScript -->
                </div>
            </aside>

            <!-- Bagian tengah -->
            <main class="notif-center">
                <header class="notif-header">

                    <div class="notif-header-top">
                        <h1>Notifications</h1>

                        <a class="notif-icon-btn"
                            href="notification-settings.html">
                            Settings
                        </a>
                    </div>

                    <button class="notif-tab active" id="all-tab" data-tab="all">
                        All
                    </button>

                    <button class="notif-tab" id="unread-tab" data-tab="unread">
                        Unread
                    </button>

                </header>

                <div id="notif-list-main"></div>

                <!-- Tampilan kosong -->
                <div class="notif-tab-empty" id="all-empty">
                    <h1>Oops nothing's here yet</h1>
                    <p>Add some friends or follow them at least.</p>
                </div>

                <div class="notif-tab-empty" id="unread-empty">
                    <h1>Oops nothing's here yet</h1>
                    <p>You have no unread notifications.</p>
                </div>
            </main>

            <!-- Filter -->
            <aside class="notif-sidebar-right">
                <div class="notif-rightbar-panel">

                    <div class="notif-rightbar-title">
                        Filter notifikasi
                    </div>

                    <!-- All -->
                    <div class="notif-filter-item active" data-filter="all">
                        <span class="notif-filter-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M4 7h16"></path>
                                <path d="M4 12h16"></path>
                                <path d="M4 17h16"></path>
                            </svg>
                        </span>

                        <span class="notif-filter-label">
                            All
                        </span>

                        <span class="notif-filter-count">
                            0
                        </span>
                    </div>

                    <!-- Follow -->
                    <div class="notif-filter-item" data-filter="follow">
                        <span class="notif-filter-icon">
                            <svg viewBox="0 0 24 24">
                                <circle cx="9" cy="8" r="4"></circle>
                                <path d="M2 21a7 7 0 0 1 14 0"></path>
                                <path d="M19 8v6"></path>
                                <path d="M16 11h6"></path>
                            </svg>
                        </span>

                        <span class="notif-filter-label">
                            Follow
                        </span>

                        <span class="notif-filter-count">
                            0
                        </span>
                    </div>

                    <!-- Reply -->
                    <div class="notif-filter-item" data-filter="reply">
                        <span class="notif-filter-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M20 11a8 8 0 0 1-8 8H5l-3 2V11a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"></path>
                            </svg>
                        </span>

                        <span class="notif-filter-label">
                            Reply
                        </span>

                        <span class="notif-filter-count">
                            0
                        </span>
                    </div>

                    <!-- Like -->
                    <div class="notif-filter-item" data-filter="like">
                        <span class="notif-filter-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M20.8 8.6c0 5.5-8.8 10.4-8.8 10.4S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.4a4.6 4.6 0 0 1 8.8 2.2z"></path>
                            </svg>
                        </span>

                        <span class="notif-filter-label">
                            Like
                        </span>

                        <span class="notif-filter-count">
                            0
                        </span>
                    </div>

                </div>
            </aside>

        </div>
    </div>

    <div class="notif-toast" id="notif-toast-panel"></div>

    <script src="app.js"></script>
</body>

</html>
