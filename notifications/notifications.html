<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications / X</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../mobile.css">

    <style>
        .notif-filter-icon svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>

<body data-bottom-nav>
    <div class="notifications">
        <div class="notif-layout">

            <!-- sidebar -->
            <aside class="sidebar-left">
                <div id="sidebar">
                    <!-- js -->
                </div>
            </aside>

            <!-- center -->
            <main class="notif-center">
                <header class="notif-header">

                    <div class="notif-header-top">
                        <button class="mobile-menu-button" aria-label="Open navigation" aria-haspopup="dialog"><img
                                src="../login/logo.jpg" alt=""></button>
                        <h1>Notifications</h1>

                        <a class="notif-icon-btn" href="../settings/settings.html#notifications" aria-label="Settings">
                            <img src="../image/icons/setting.svg" alt="">
                        </a>
                    </div>

                    <button class="notif-tab active" id="all-tab" data-tab="all">
                        All
                    </button>

                    <button class="notif-tab" id="unread-tab" data-tab="unread">
                        Unread
                    </button>
                </header>

                <!-- filter untuk tampilan mobile -->
                <div id="mobile-notif-filters">
                    <div class="notif-chips" aria-label="Filter notifikasi">
                        <button class="notif-filter-item notif-chip active" data-filter="all">All</button>
                        <button class="notif-filter-item notif-chip" data-filter="follow">Follow</button>
                        <button class="notif-filter-item notif-chip" data-filter="reply">Reply</button>
                        <button class="notif-filter-item notif-chip" data-filter="like">Like</button>
                        <button class="notif-filter-item notif-chip" data-filter="mention">Mention</button>
                    </div>
                </div>
                <div id="notif-list-main"></div>

                <!-- empty state-->
                <div class="notif-tab-empty" id="all-empty">
                    <h1>Oops nothing's here yet</h1>
                    <p>Add some friends or follow them at least.</p>
                </div>

                <div class="notif-tab-empty" id="unread-empty">
                    <h1>Oops nothing's here yet</h1>
                    <p>You have no unread notifications.</p>
                </div>
            </main>

            <!-- filter kanan untuk tampilan desktop -->
            <aside class="notif-sidebar-right">
                <div class="notif-rightbar-panel">
                    <h2 class="notif-rightbar-title">Filter notifikasi</h2>

                    <button class="notif-filter-item active" data-filter="all">
                        <span class="notif-filter-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M4 7h16M4 12h16M4 17h16" />
                            </svg>
                        </span>
                        <span class="notif-filter-label">All</span>
                        <span class="notif-filter-count">4</span>
                    </button>
                    <button class="notif-filter-item" data-filter="follow">
                        <span class="notif-filter-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <circle cx="9" cy="8" r="3" />
                                <path d="M3 19c.5-3 2.5-5 6-5s5.5 2 6 5M17 8v6M14 11h6" />
                            </svg>
                        </span>
                        <span class="notif-filter-label">Follow</span>
                        <span class="notif-filter-count">1</span>
                    </button>
                    <button class="notif-filter-item" data-filter="reply">
                        <span class="notif-filter-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M20 11.5a7 7 0 0 1-7 7H7l-4 3v-10a7 7 0 0 1 7-7h3a7 7 0 0 1 7 7Z" />
                            </svg>
                        </span>
                        <span class="notif-filter-label">Reply</span>
                        <span class="notif-filter-count">1</span>
                    </button>
                    <button class="notif-filter-item" data-filter="like">
                        <span class="notif-filter-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M20.8 8.8c0 5.5-8.8 10.2-8.8 10.2S3.2 14.3 3.2 8.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 8.8 2.8Z" />
                            </svg>
                        </span>
                        <span class="notif-filter-label">Like</span>
                        <span class="notif-filter-count">1</span>
                    </button>
                    <button class="notif-filter-item" data-filter="mention">
                        <span class="notif-filter-icon" aria-hidden="true">@</span>
                        <span class="notif-filter-label">Mention</span>
                        <span class="notif-filter-count">1</span>
                    </button>
                </div>
            </aside>

        </div>
    </div>

    <div class="notif-toast" id="notif-toast-panel"></div>

    <script src="app.js"></script>
    <script src="../user-loader.js"></script>
    <script src="../mobile-navigation.js"></script>
</body>

</html>
