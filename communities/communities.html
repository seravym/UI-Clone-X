<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communities - X Clone</title>
    <link rel="stylesheet" href="communities.css">
</head>

<body>
    <div class="communities">

        <header class="communities-header">
            <h1>
                Communities
            </h1>
        </header>

       <nav class="communities-nav">
            <a href="#home" class="nav-tab active">Home</a>
            <a href="#explore" class="nav-tab">Explore</a>
        </nav>

        <section class="communities-home" id="home">
            <div class="empty-community">
                You haven't joined any Communities yet.
                <button class="join-button">Jelajahi komunitas</button>
            </div>

            <article class="post">
                <div class="post-community">Liga 1 Fans</div>
                <p class="post-author"><strong>Bagus</strong> <span>@bagus_bola · 2j</span></p>
                <p class="post-text">Derby akhir pekan ini bakal panas. Prediksi skor kalian?</p>
            </article>
            
        </section>

        <div class="category-chips">
                <button class="chip active">Sports</button>
                <button class="chip">Technology</button>
                <button class="chip">Art</button>
                <button class="chip">Entertainment</button>
                <button class="chip">Gaming</button>
            </div>

            <p class="explore-title">Komunitas rekomendasi di Sports</p>

            <div class="community-list">

                <div class="community-row">
                    <div class="community-avatar">L1</div>
                    <div class="community-info">
                        <p class="community-name">Liga 1 Fans</p>
                        <p class="community-members">12K anggota</p>
                    </div>
                    <button class="join-button">Join</button>
                </div>

                <div class="community-row">
                    <div class="community-avatar">BI</div>
                    <div class="community-info">
                        <p class="community-name">Badminton Indonesia</p>
                        <p class="community-members">8,4K anggota</p>
                    </div>
                    <button class="join-button">Join</button>
                </div>

                <div class="community-row">
                    <div class="community-avatar">RJ</div>
                    <div class="community-info">
                        <p class="community-name">Runners Jakarta</p>
                        <p class="community-members">5,1K anggota</p>
                    </div>
                    <button class="join-button">Join</button>
                </div>

            </div>
        </section>

    </div>

    <script src="communities.js"></script>

</body>
</html>
