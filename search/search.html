<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search / X Clone — Kelompok 9</title>
<link rel="stylesheet" href="css/search.css">
</head>
<body>
<div class="app">

    <nav class="nav" id="nav" aria-label="Navigasi utama">
        <!-- Sidebar kiri: tempelkan nav buatan teman di sini -->
    </nav>

    <main class="main">
        <header class="main__header">
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="mainSearch" type="text" placeholder="Cari di X" autocomplete="off" aria-label="Cari di X">
            <button class="search-box__clear" id="mainSearchClear" aria-label="Hapus pencarian">✕</button>
        </div>
        </header>

        <!-- State 1: empty query -> recent searches -->
        <section id="recentPanel">
        <div class="section-heading">
            <h2>Pencarian terbaru</h2>
            <button class="link-btn" id="clearRecent">Hapus semua</button>
        </div>
        <div id="recentList"></div>
        </section>

        <!-- State 2: has query -> tabs + results -->
        <section id="resultsPanel" style="display:none;">
        <div class="tabs" role="tablist">
            <button class="tab is-active" data-tab="top" role="tab">Top</button>
            <button class="tab" data-tab="latest" role="tab">Latest</button>
            <button class="tab" data-tab="people" role="tab">People</button>
            <button class="tab" data-tab="media" role="tab">Media</button>
        </div>

        <div class="panel is-active" data-panel="top" id="panelTop"></div>
        <div class="panel" data-panel="latest" id="panelLatest"></div>
        <div class="panel" data-panel="people" id="panelPeople"></div>
        <div class="panel" data-panel="media" id="panelMedia"></div>
        </section>
    </main>

    <aside class="side" id="side" aria-label="Sidebar">
        <div id="sideContent"></div>
    </aside>

</div>

    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/search.js"></script>

</body>
</html>
