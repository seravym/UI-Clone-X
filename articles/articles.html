<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Articles / X Clone — Kelompok 9</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/articles.css">
    </head>
    <body>
        <div class="app">
            <aside class="sidebar-left">
                <div id="sidebar"></div>
            </aside>

            <main class="articles">
                <header class="articles-header">
                    <div class="articles-headrow">
                        <button class="back-btn" id="backBtn" type="button" aria-label="Kembali ke daftar artikel" hidden>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
                        </button>
                        <h1 class="articles-title" id="pageTitle" tabindex="-1">Articles</h1>
                        <button class="write-btn" id="openWrite" type="button">New Articles</button>
                    </div>

                    <div class="search-box" id="listSearch" role="search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                        <input id="articleSearch" type="text" placeholder="Cari artikel atau penulis" autocomplete="off" aria-label="Cari artikel atau penulis">
                    </div>
                </header>

                <section id="listView">
                    <nav class="articles-nav" id="articleTabs" role="tablist" aria-label="Article categories">
                        <button class="articles-tab is-active" role="tab" aria-selected="true" data-cat="all">For You</button>
                        <button class="articles-tab" role="tab" aria-selected="false" data-cat="Teknologi">Technology</button>
                        <button class="articles-tab" role="tab" aria-selected="false" data-cat="Desain">Design</button>
                        <button class="articles-tab" role="tab" aria-selected="false" data-cat="Data">Data</button>
                        <button class="articles-tab" role="tab" aria-selected="false" data-cat="Kuliner">Food</button>
                        <button class="articles-tab" role="tab" aria-selected="false" data-cat="Perjalanan">Travel</button>
                        <button class="articles-tab" role="tab" aria-selected="false" data-cat="saved">Saved</button>
                    </nav>
                    <div id="articleList"></div>
                </section>

                <section id="readerView" hidden>
                    <div id="readerContent"></div>
                </section>

                <section id="writeView" hidden>
                    <form class="write-form" id="writeForm" novalidate>
                        <div class="field">
                            <label for="wTitle">Title</label>
                            <input id="wTitle" type="text" maxlength="120" placeholder="Judul artikel Anda" autocomplete="off">
                        </div>
                        <div class="field">
                            <label for="wCat">Category</label>
                            <select id="wCat"></select>
                        </div>
                        <div class="field">
                            <label for="wBody">Write here.</label>
                            <textarea id="wBody" placeholder="Tulis artikel Anda di sini. Pisahkan paragraf dengan satu baris kosong."></textarea>
                            <div class="field__hint"><span id="wCount"></span></div>
                        </div>
                        <p class="form-error" id="wError" role="alert"></p>
                        <div class="form-actions">
                            <button class="ghost-btn" id="wCancel" type="button">Batal</button>
                            <button class="write-btn" type="submit">Terbitkan</button>
                        </div>
                    </form>
                </section>
            </main>

            <aside class="side" aria-label="Sidebar">
                <section class="widget">
                    <h2>Popular Articles</h2>
                    <div id="sidePopular"></div>
                </section>
                <section class="widget">
                    <h2>Saved</h2>
                    <div id="sideSaved"></div>
                </section>
            </aside>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        
        <script src="js/articles.js"></script>
    </body>
</html>
