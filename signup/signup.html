<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <div class="page">
    <section class="main-content">
      <a class="back-link" href="../login/login.html">&larr;</a>

      <h1>Create Account</h1>
      <p class="subtitle">Join us and stay updated with news all around the world</p>

      <div class="card">
        <form action="../auth/auth.html" method="get">
          <input type="hidden" name="type" value="email">

          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Username"
            minlength="3" maxlength="20" pattern="[A-Za-z0-9_.]+"
            title="3-20 characters: letters, numbers, _ or ."
            autocomplete="username" required>

          <label for="email">Email</label>
          <input id="email" name="value" type="email" placeholder="Email" autocomplete="email" required>

          <label for="password">Password</label>
          <div class="password-wrapper">
            <input id="password" type="password" placeholder="Password"
              pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
              title="At least 8 characters, with letters and numbers"
              autocomplete="new-password" required>
            <span class="toggle-password" id="toggle-password">🔒</span>
          </div>

          <label for="confirm-password">Confirm password</label>
          <div class="password-wrapper">
            <input id="confirm-password" type="password" placeholder="Confirm password"
              autocomplete="new-password" required>
            <span class="toggle-password" id="toggle-confirm-password">🔒</span>
          </div>

          <div class="remember">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the Terms &amp; Conditions</label>
          </div>

          <button class="button" type="submit">Create account</button>
        </form>
      </div>

      <p class="register">Already have an account? <a href="../login/login.html">Login!</a></p>
    </section>

    <aside class="image">
      <img src="../login/logo.jpg" alt="">
    </aside>
  </div>

  <script src="signup.js"></script>
</body>
</html>
