<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Thread</title>
    <link rel="stylesheet" href="thread-builder.css">
</head>

<body>

    <div class="builder-container">
        <a href="threads.html" class="back-btn">← Cancel</a>

        <h1 class="page-title">Create Thread</h1>

        <input type="text" id="thread-title" class="thread-title-input" placeholder="Judul Thread (Opsional)">

        <div id="tweets-area">
            <div class="tweet-box">
                <img data-user-avatar src="../profile/default.jpg" alt="Profile" class="avatar">
                <div class="input-area">
                    <textarea class="tweet-input" placeholder="Start your thread..."></textarea>
                    <div class="char-count">0 / 280</div>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn add-btn" id="add-tweet-btn">+ Add Tweet</button>
            <button class="btn draft-btn" id="save-draft-btn">Save Draft</button>
            <button class="btn publish-btn" id="publish-btn">Publish Thread</button>
        </div>
    </div>

    <div id="toast" class="toast">Pesan akan muncul di sini</div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../user-loader.js"></script>
    <script src="thread-builder.js"></script>

</body>

</html>
