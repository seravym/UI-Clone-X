<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifikasi OTP</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="page">
    <section class="main-content">
      <h1>Verifikasi</h1>
      <p class="subtitle">Masukkan kode OTP yang sudah dikirim</p>

      <div class="card">
        <form id="otp-form">
          <div class="otp-group">
            <input type="text" maxlength="1" class="otp-box" required>
            <input type="text" maxlength="1" class="otp-box" required>
            <input type="text" maxlength="1" class="otp-box" required>
            <input type="text" maxlength="1" class="otp-box" required>
          </div>

          <button class="button" type="submit">Verifikasi</button>
        </form>

        <p class="resend">Tidak menerima kode? <a href="#" id="resend-link">Kirim ulang</a></p>
      </div>
    </section>

    <aside class="image">
      <img src="../login/logo.jpg" alt="">
    </aside>
  </div>

  <script src="otp.js"></script>
</body>
</html>
