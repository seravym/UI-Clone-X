<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifikasi</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="page">
    <section class="main-content">
      <a class="back-link" href="../login/login-number.html">&larr;</a>

      <h1>Verifikasi Akun</h1>
      <p class="subtitle" id="otp-subtitle">Masukkan kode OTP</p>

      <div class="card">
        <p class="otp-demo" id="otp-demo"></p>

        <form id="otp-form">
          <div class="otp-group">
            <input type="text" maxlength="1" class="otp-box" required>
            <input type="text" maxlength="1" class="otp-box" required>
            <input type="text" maxlength="1" class="otp-box" required>
            <input type="text" maxlength="1" class="otp-box" required>
          </div>

          <button class="button" type="submit">Verifikasi</button>
        </form>

        <p class="resend">Tidak menerima kode? <a href="#" id="resend-link">Kirim ulang</a></p>
        <p class="resend-info" id="resend-info" hidden></p>
      </div>
    </section>

    <aside class="image">
      <img src="../login/logo.jpg" alt="">
    </aside>
  </div>
  <script src="auth.js"></script>
</body>
</html>
