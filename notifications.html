<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications / X</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-black text-white">

    <div class="container-fluid px-0 px-md-3 app">
        <div class="row vh-100 g-0 overflow-hidden">

            <!-- left -->
            <div id="sidebar-container" class="col-2 col-md-3 border-end border-secondary p-2"></div>

            <!-- center -->
            <main class="col-10 col-md-5 border-end border-secondary d-flex flex-column h-100 overflow-y-auto">

                <header class="x-header sticky-top">
                    <div class="d-flex justify-content-between align-items-center p-3">
                        <h5 class="fw-bold m-0">Notifications</h5>
                        <button type="button" class="btn btn-link text-white p-0 shadow-none">
                            <i class="bi bi-gear fs-5"></i>
                        </button>
                    </div>

                    <div class="x-tabs" id="notifTab">
                        <button class="x-tab active" data-bs-toggle="pill" data-bs-target="#notif-all">
                            All
                        </button>
                        <button class="x-tab" data-bs-toggle="pill" data-bs-target="#notif-mentions">
                            Mentions
                        </button>
                    </div>
                </header>

                <div class="tab-content flex-grow-1" id="notifTabContent">

                    <div class="tab-pane fade show active p-4 mt-4" id="notif-all" role="tabpanel">
                        <div class="mx-auto empty-state">
                            <h2 class="fw-bold fs-3 mb-2">Nothing to see here — yet</h2>
                            <p class="text-secondary small mb-0">
                                From likes to reposts and a whole lot more, this is where all the action happens.
                            </p>
                        </div>
                    </div>

                    <div class="tab-pane fade p-4 mt-4" id="notif-mentions" role="tabpanel">
                        <div class="mx-auto empty-state">
                            <h2 class="fw-bold fs-3 mb-2">Nothing to see here — yet</h2>
                            <p class="text-secondary small mb-0">
                                When someone mentions you, you'll find it here.
                            </p>
                        </div>
                    </div>

                </div>
            </main>

            <!-- right -->
            <aside class="col-md-4 d-none d-md-block p-3 overflow-y-auto h-100">
                <div class="x-search">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="Search">
                </div>
            </aside>

        </div>
    </div>

    <script src="jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>

</body>

</html>
