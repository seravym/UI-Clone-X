<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!--header navbar-->

<header class = "container">
<h2>FOTO PROFIL</h2>

        <header class="container profile-page">
        <div class="profile-info">
        <div class="avatar">
        <div class="upload-circle">
            <img id="profile-pic" class="profile" src="default.jpg" alt="Foto profil">
        </div>
        </div>

        <img id="profile-pic" class="profile" alt="Foto profil" style="display:none">

        <h3 id="profile-name">Nama Akun</h3>
        <p id="profile-username">@username</p>
        <p id="Bio"></p>
         <div class="profile-actions">

        <button class = "button button1" 
        onclick="window.location.href='edit_profile.html'">
        Edit Profile
    </button>
    <button class = "button button2" 
    onclick="window.location.href='share.html'">
        Share
    </button>
    </div>

    <script>
    const name = localStorage.getItem("profileName");
    const username = localStorage.getItem("profileUsername");
    const bio = localStorage.getItem("profileBio");
    const pic = localStorage.getItem("profilePic");

    if (pic) document.getElementById("profile-pic").src = pic;
    if (name) document.getElementById("profile-name").textContent = name;
    if (username) document.getElementById("profile-username").textContent = "@" + username;
    if (bio) document.getElementById("profilebio").textContent = bio;
    </script>
</header>
</body>
    </html>
