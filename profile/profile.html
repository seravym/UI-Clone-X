<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

<!--header navbar-->

<header class = "container">
<h2>FOTO PROFIL</h2>

        <div class="upload-circle">
            <img id="profile-pic" class="profile" src="default.jpg" alt="Foto profil">
        </div>

        <img id="profile-pic" class="profile" alt="Foto profil" style="display:none">

<button class = "button button1" onclick="window.location.href='edit_profile.html'">Edit Profile</button>
<button class = "button button2" onclick="window.location.href='share.html'">Share</button>

    <script>
        const pic = localStorage.getItem("profilePic");
    const img = document.getElementById("profile-pic");
    if (pic) {
        img.src = pic;
        img.style.display = "block";
    }
    </script>
</header>
