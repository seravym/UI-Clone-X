    <script>
    const name = localStorage.getItem("profileName") || "Nama Akun";
    const username = localStorage.getItem("profileUsername") || "username";
    const bio = localStorage.getItem("profileBio");
    const pic = localStorage.getItem("profilePic");

    if (pic) document.getElementById("profile-pic").src = pic;
    if (name) document.getElementById("profile-name").textContent = name;
    if (username) document.getElementById("profile-username").textContent = "@" + username;
    if (bio) document.getElementById("profileBio").textContent = bio;

document.querySelectorAll(".post-name").forEach(function(item) {
    item.textContent = name;
});

document.querySelectorAll(".post-username").forEach(function(item) {
    item.textContent = "@" + username;
});

if (profilePic) {
    document.querySelectorAll(".post-profile").forEach(function(item) {
        item.src = profilePic;
    });
}

    </script>
