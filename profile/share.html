<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagikan profil</title>
    <link rel="stylesheet" href="share.css">
    <link rel="stylesheet" href="sharepop.css">
</head>
<body>
<div class="sh-box">

    <div class="sh-header">
        <h1 class="sh-title">BAGIKAN <span>LEWAT MANA?</span></h1>
        <button class="sh-x" id="sh-close" type="button" aria-label="Tutup">X</button>
    </div>

    <div class="sh-grid">
        <button class="sh-option" type="button" data-share="chat" title="Chat" aria-label="Chat">
            <img src="../image/icons/chat.svg" alt="Chat">
        </button>

        <button class="sh-option" type="button" data-share="copy" title="Salin tautan" aria-label="Salin tautan">
            <img src="../image/icons/link.svg" alt="Salin tautan">
        </button>

        <button class="sh-option" type="button" data-share="whatsapp" title="WhatsApp" aria-label="WhatsApp">
            <img src="../image/icons/whatsap.svg" alt="WhatsApp">
        </button>

        <button class="sh-option" type="button" data-share="telegram" title="Telegram" aria-label="Telegram">
            <img src="../image/icons/cha.svg" alt="Telegram">
        </button>

        <button class="sh-option" type="button" data-share="native" title="Lainnya" aria-label="Lainnya">
            <img src="../image/icons/more.svg" alt="Lainnya">
        </button>
    </div>

</div>

<script src="share.js"></script>
</body>
</html>
