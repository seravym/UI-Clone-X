<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="container1">
    <h1 class="anime">HI LET'S<span> EDIT</span></h1>
    <button class="ex" onclick="window.location.href='profile.html'">x</button>

    <!-- BANNER -->
    <div class="banner-edit">
        <span class="banner-hint">↕ Geser untuk atur posisi</span>
        <img id="banner-preview" src="banner.png" alt="Banner">

        <div class="banner-actions">
            <!-- ganti banner -->
            <label for="banner-upload" class="banner-btn" title="Ganti banner">
                <svg viewBox="0 0 24 24">
                    <path d="M4 8h3l2-3h6l2 3h3v11H4z"/>
                    <circle cx="12" cy="13" r="3.5"/>
                </svg>
            </label>
            <!-- hapus banner -->
            <button type="button" id="banner-remove" class="banner-btn" title="Hapus banner">
                <svg viewBox="0 0 24 24">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
            </button>
        </div>
        <input type="file" id="banner-upload" accept="image/*" hidden>
    </div>

    <!-- FORM -->
    <div class="edit-content">
        <label for="profile-upload" class="upload-circle">
            <img id="profile-preview" class="profile" src="default.jpg" alt="Foto profil">
            <span class="plus">+</span>
        </label>
        <input type="file" id="profile-upload" accept="image/*">

        <div class="form-box">
            <div class="edit">
                <label for="akun">Nama Akun</label>
                <input type="text" id="akun" class="text-input" maxlength="10">
            </div>
            <div class="edit">
                <label for="acc">Id Akun</label>
                <input type="text" id="acc" class="text-input" maxlength="20">
            </div>
            <div class="edit">
                <label for="bio">Bio</label>
                <textarea id="bio" rows="4" class="text-input" maxlength="50" placeholder="Maksimal 50 huruf"></textarea>
            </div>
        </div>
    </div>

    <button class="save-btn" onclick="saveProfile()">Save</button>
</header>

<script src="app.js"></script>
</body>
</html>
