<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="container1">
    <h1 class="anime">HI LET'S<span> EDIT</span></h1>
    <button class="ex" onclick="window.location.href='profile.html'">x</button>
<div class="edit">
    <label for="banner-upload">Banner</label>
    <input type="file" id="banner-upload" accept="image/*">
    <img id="banner-preview" style="display:none; width:100%; max-height:120px; object-fit:cover;">


</div>
    <div class="edit-content">
        <label for="profile-upload" class="upload-circle">
            <img id="profile-preview" class="profile" src="default.jpg" alt="Foto profil">
            <span class="plus">+</span>
        </label>
        <input type="file" id="profile-upload" accept="image/*">

        <div class="form-box">
            <div class="edit">
                <label for="akun">Nama Akun</label>
                <input type="text" id="akun" class="text-input" maxlength="10">
            </div>
            <div class="edit">
                <label for="acc">Id Akun</label>
                <input type="text" id="acc" class="text-input" maxlength="20">
            </div>
            <div class="edit">
                <label for="bio">Bio</label>
                <textarea id="bio" rows="4" class="text-input" maxlength="50" placeholder="Maksimal 50 huruf"></textarea>
            </div>
        </div>
    </div>

    <button class="save-btn" onclick="saveProfile()">Save</button>


     <aside class="right-sidebar">
            <input type="text" placeholder="Search..." class="search-bar">
            <div class="trending-box">
                <h4>Trending</h4>
                <p class="text-pink">#randomtrend</p>
            </div>
        </aside>
</header>


    <script src="app.js">
    </script>

</body>
</html>
