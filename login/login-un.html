<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enter Password</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="page">
    <section class="main-content">
      <a class="back-link" href="login.html">&larr;</a>

      <h1>Welcome Back!</h1>
      <p class="subtitle">Enter the password for <strong id="username-display"></strong></p>

      <div class="card">
        <form action="#" method="post">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
            <span class="toggle-password" id="toggle-password">🔒</span>
          </div>

          <button class="button" type="submit">Login</button>
        </form>
      </div>

      <p class="register">Don't have an account? <a href="../signup/signup.html">Create account!</a></p>
    </section>

    <aside class="image">
      <img src="logo.jpg" alt="">
    </aside>
  </div>

  <script src="username.js"></script>
</body>
</html>
