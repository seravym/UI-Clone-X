<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Page</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="page">
    <section class="main-content">
      <h1>Welcome to </h1>
      <p class="subtitle">Stay updated with news all around the world</p>

      <div class="card">
        <a class="button" href="login-email.html">Login with Email</a>
        <a class="button" href="login-phone.html">Login with Phone Number</a>

        <p class="or-text">or</p>

        <form action="#" method="post">
          <label for="username">Login with Username</label>
          <input id="username" name="username" type="text" placeholder="@Username">
        </form>
      </div>

      <p class="register">Don't have an account? <a href="register.html">Create account!</a></p>
    </section>

    <aside class="image">
      <img src="logo.jpg" alt="">
    </aside>
  </div>

</html>
