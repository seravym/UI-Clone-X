<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Page</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="page">
    <section class="main-content">
      <h1>Get Started!</h1>
      <p class="subtitle">updated with news all around the world</p>

      <div class="card">
        <a class="button" href="login-email.html">Login with Email</a>
        <a class="button" href="login-number.html">Login with Phone Number</a>

        <p class="or-text">or</p>

        <form action="#" method="post">
          <label for="username">Login with Username</label>
          <input id="username" name="username" type="text" placeholder="Username" list="username-suggestions" autocomplete="off">
          <datalist id="username-suggestions"></datalist>
          <button class="button" type="submit">Next</button>
        </form>
      </div>

      <p class="register">Don't have an account? <a href="../signup/signup.html">Create account!</a></p>
    </section>

    <aside class="image">
      <img src="logo.jpg" alt="">
    </aside>
  </div>

  <script src="login.js"></script>
</body>
</html>
