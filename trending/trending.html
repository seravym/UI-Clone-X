<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sedang tren / X Clone — Kelompok 9</title>
<link rel="stylesheet" href="css/trending.css">
<link rel="stylesheet" href="../css/style.css">

</head>
<body>
<div class="app">
    <aside class="sidebar-left">
        <div id="sidebar"></div>
    </aside>

    <main class="main">
        <header class="main__header">
            <form class="search-box" action="search/search.html" method="get" role="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input name="q" type="text" placeholder="Cari di X" autocomplete="off" aria-label="Cari di X">
            </form>
        </header>

        <div class="page-title">
            <h1>Sedang tren</h1>
        </div>

        <div class="tabs" id="trendTabs" role="tablist" aria-label="Kategori tren">
            <button class="tab is-active" role="tab" aria-selected="true" data-cat="all">Untuk Anda</button>
            <button class="tab" role="tab" aria-selected="false" data-cat="Teknologi">Teknologi</button>
            <button class="tab" role="tab" aria-selected="false" data-cat="Hiburan">Hiburan</button>
            <button class="tab" role="tab" aria-selected="false" data-cat="Olahraga">Olahraga</button>
            <button class="tab" role="tab" aria-selected="false" data-cat="Kuliner">Kuliner</button>
            <button class="tab" role="tab" aria-selected="false" data-cat="Berita">Berita</button>
        </div>

        <div id="trendList" aria-live="polite"></div>

        <button class="link-btn link-btn--block" id="showMore" type="button">Tampilkan lebih banyak</button>
    </main>

    <aside class="side" aria-label="Sidebar">
        <section class="card">
            <h2>Teratas hari ini</h2>
            <div id="topToday"></div>
        </section>
        <p class="side__foot">Halaman latihan. Semua topik dan angka di sini fiktif.</p>
    </aside>
</div>

<script src="js/trending.js"></script>
<script src="../app.js"></script>

</body>
</html>
