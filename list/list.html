<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List - X Clone</title>
    <link rel="stylesheet" href="list.css">
</head>

<body>
    <div class="list">
        <header class="list-header">
            <button class="back-button">←</button>
            <h1>Lists</h1>
        </header>

        <div class="list-search">
            <input type="text" placeholder="🔍 Search Lists">
        </div>

        <section class="list-list">
            <div class="discover-lists">
                <h2>Discover new Lists</h2>
            </div>

            <div class="your-lists">
                <h2>Your Lists</h2>
            </div>
        </section>
    </div>

</body>
</html>
